_schema-version: '3.1'
ID: employee-app
version: 1.0.0
description: Employee Management App

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install --legacy-peer-deps
        - cp -r app/employee-list/webapp app/router/webapp

modules:
  - name: employee-app-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: custom
      commands:
        - npm install --production
    provides:
      - name: srv-api
        properties:
          srv-url: '${default-url}'
    requires:
      - name: employee-app-db

  - name: employee-app-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands:
        - npm install --legacy-peer-deps
    requires:
      - name: employee-app-db

  - name: employee-app
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    build-parameters:
      builder: custom
      commands:
        - npm install --legacy-peer-deps
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: '~{srv-url}'
          forwardAuthToken: true

resources:
  - name: employee-app-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
    properties:
      hdi-service-name: '${service-name}'